<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="107" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Glowing Eco Leaves / Route Emblem -->
  <g transform="translate(48, 48) scale(0.8125)">
    <!-- Route Arc / Path Behind -->
    <path d="M 120 380 C 120 220, 240 140, 390 140" fill="none" stroke="url(#routeGrad)" stroke-width="28" stroke-linecap="round" stroke-dasharray="8 16" opacity="0.85"/>
    
    <!-- Large Primary Leaf -->
    <path d="M 256 64 C 380 64, 448 180, 448 304 C 448 410, 370 448, 256 448 C 256 320, 160 220, 256 64 Z" 
          fill="url(#leafGrad)" filter="url(#glow)"/>

    <!-- Inner Secondary Leaf / Recycling Spine -->
    <path d="M 256 160 C 320 200, 360 280, 340 370 C 300 410, 240 400, 256 160 Z" 
          fill="#86efac" opacity="0.6"/>

    <!-- Small Accent Sprout Leaf -->
    <path d="M 140 280 C 200 240, 240 280, 256 340 C 200 370, 150 350, 140 280 Z" 
          fill="#34d399"/>

    <!-- GPS Node Rings -->
    <circle cx="120" cy="380" r="22" fill="#38bdf8"/>
    <circle cx="120" cy="380" r="10" fill="#ffffff"/>
    <circle cx="390" cy="140" r="22" fill="#22c55e"/>
    <circle cx="390" cy="140" r="10" fill="#ffffff"/>

    <!-- Modern Clean Truck Accent Silhouette -->
    <g transform="translate(196, 260) scale(1.1)">
      <!-- Truck Body -->
      <rect x="0" y="20" width="70" height="42" rx="8" fill="#ffffff"/>
      <path d="M 70 32 L 92 32 L 104 46 L 104 62 L 70 62 Z" fill="#ffffff"/>
      <!-- Window -->
      <path d="M 74 36 L 90 36 L 98 46 L 74 46 Z" fill="#047857"/>
      <!-- Wheels -->
      <circle cx="22" cy="64" r="12" fill="#0f172a"/>
      <circle cx="22" cy="64" r="5" fill="#4ade80"/>
      <circle cx="82" cy="64" r="12" fill="#0f172a"/>
      <circle cx="82" cy="64" r="5" fill="#4ade80"/>
    </g>
  </g>
</svg>
